name: Collect opportunities
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths: ["data/manual.csv"]
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python collect.py
      - run: python notify.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
      - name: Commit data
        run: |
          git config user.name "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Update opportunities" && git push)
